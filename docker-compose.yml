name: haksan

x-runtime-hardening: &runtime-hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *runtime-hardening
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - haksan_postgres_data:/var/lib/postgresql/data
    networks:
      - haksan_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    <<: *runtime-hardening
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - haksan_minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - haksan_internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    <<: *runtime-hardening
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - haksan_internal
    entrypoint: >
      /bin/sh -c "
      if [ \"$${MINIO_ROOT_USER}\" = \"minioadmin\" ] || [ \"$${MINIO_ROOT_PASSWORD}\" = \"minioadmin\" ]; then exit 1; fi;
      if [ \"$${MINIO_ROOT_USER}\" = \"$${S3_ACCESS_KEY_ID}\" ] || [ \"$${MINIO_ROOT_PASSWORD}\" = \"$${S3_SECRET_ACCESS_KEY}\" ]; then exit 1; fi;
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mc admin user add local \"$${S3_ACCESS_KEY_ID}\" \"$${S3_SECRET_ACCESS_KEY}\" || true;
      mc admin policy attach local readwrite --user \"$${S3_ACCESS_KEY_ID}\";
      mc mb -p local/erp-product-images || true;
      mc mb -p local/erp-company-logos || true;
      mc mb -p local/erp-brand-logos || true;
      mc mb -p local/erp-quote-documents || true;
      mc mb -p local/erp-proforma-documents || true;
      mc mb -p local/erp-contract-documents || true;
      mc mb -p local/erp-invoice-documents || true;
      mc mb -p local/erp-stock-documents || true;
      mc mb -p local/erp-service-documents || true;
      mc mb -p local/erp-import-raw || true;
      mc mb -p local/$${S3_BACKUP_BUCKET} || true;
      mc anonymous set none local/erp-product-images || true;
      mc anonymous set none local/erp-company-logos || true;
      mc anonymous set none local/erp-brand-logos || true;
      mc anonymous set none local/$${S3_BACKUP_BUCKET} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:?S3_BACKUP_BUCKET is required}

  api:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    env_file:
      - .env
    # Compose-level required substitutions make `docker compose up` fail before
    # an API container starts with a partial root .env file.
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_SSL: ${DATABASE_SSL:?DATABASE_SSL is required}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:?DATABASE_SSL_REJECT_UNAUTHORIZED is required}
      DATABASE_ALLOW_PLAINTEXT: ${DATABASE_ALLOW_PLAINTEXT:?DATABASE_ALLOW_PLAINTEXT is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?COOKIE_DOMAIN is required}
      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE is required}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:?COOKIE_SAMESITE is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CALL_WEBHOOK_SECRET: ${CALL_WEBHOOK_SECRET:?CALL_WEBHOOK_SECRET is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      S3_PROVIDER: ${S3_PROVIDER:?S3_PROVIDER is required}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX:?S3_BUCKET_PREFIX is required}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:?S3_BACKUP_BUCKET is required}
      DB_BACKUP_ENABLED: ${DB_BACKUP_ENABLED:?DB_BACKUP_ENABLED is required}
      DB_BACKUP_REQUIRED: ${DB_BACKUP_REQUIRED:?DB_BACKUP_REQUIRED is required}
      DB_BACKUP_TIMEOUT_SECONDS: ${DB_BACKUP_TIMEOUT_SECONDS:?DB_BACKUP_TIMEOUT_SECONDS is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:?SMTP_SECURE is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      USER_MAIL_ENABLED: ${USER_MAIL_ENABLED:-false}
      USER_MAIL_SMTP_HOST: ${USER_MAIL_SMTP_HOST:-mail.haksancnc.com.tr}
      USER_MAIL_SMTP_PORT: ${USER_MAIL_SMTP_PORT:-587}
      USER_MAIL_SMTP_SECURE: ${USER_MAIL_SMTP_SECURE:-false}
      USER_MAIL_ALLOWED_EMAIL_DOMAINS: ${USER_MAIL_ALLOWED_EMAIL_DOMAINS:-haksancnc.com.tr}
      USER_MAIL_CREDENTIAL_ENCRYPTION_KEY: ${USER_MAIL_CREDENTIAL_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    cap_drop:
      - ALL
    pids_limit: 512
    networks:
      - haksan_internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  nginx:
    <<: *runtime-hardening
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?STORAGE_DOMAIN is required}
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    pids_limit: 256
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    networks:
      - haksan_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  certbot:
    <<: *runtime-hardening
    image: certbot/certbot:v2.11.0
    profiles:
      - certbot
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    networks:
      - haksan_internal

volumes:
  haksan_postgres_data:
  haksan_minio_data:

networks:
  haksan_internal:
    driver: bridge
