# Render Blueprint — staging (production = kendi VDS, bkz. deploy/README.md)
# Depolama: Cloudflare R2 (S3 uyumlu) — S3_* dashboard'dan girilir.
#
# İlk deploy sonrası API Shell (sıfır iş verisi — siz doldurursunuz):
#   npm run db:seed
#   TENANT_NAME=... TENANT_SLUG=... ADMIN_EMAIL=... ADMIN_PASSWORD=... ADMIN_NAME=... npm run db:bootstrap
# Demo veri YÜKLEMEYİN (npm run db:seed:demo).

databases:
  - name: haksan-db
    databaseName: haksan
    user: haksan
    plan: free
    region: frankfurt

services:
  - type: web
    name: haksan-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    branch: main
    autoDeploy: true
    # /health/ready gates on DB connectivity AND applied-migration count, so a
    # deploy with pending/failed migrations will not start receiving traffic.
    healthCheckPath: /health/ready
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build:shared && npm run build:api
    # Pre-deploy chain (compiled, no tsx/devDependency at deploy time):
    #   1) backup    — pg_dump -> R2 snapshot before any schema change (opt-in via
    #                  DB_BACKUP_ENABLED; no-op if pg_dump is unavailable unless
    #                  DB_BACKUP_REQUIRED=true).
    #   2) migrate   — schema migrations. SQL + journal are copied into dist via
    #                  nest-cli `assets`; path resolved from __dirname (cwd-safe).
    #   3) data-migrate — idempotent DML (e.g. new permissions -> existing roles).
    preDeployCommand: node apps/api/dist/db/backup.js && node apps/api/dist/db/migrate.js && node apps/api/dist/db/data-migrate.js
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DB_PROVIDER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: haksan-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Host-only cookie (Domain yok) — çapraz-origin refresh için api alt alanında bırakılır.
      - key: COOKIE_DOMAIN
        value: localhost
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        value: https://haksan-web.onrender.com
      - key: AUTH_DEV_RESET_TOKEN_RESPONSE
        value: "false"
      # Pre-deploy DB backup to R2 (gzip pg_dump). Render Node runtime'da pg_dump
      # yoksa no-op olur; DB_BACKUP_REQUIRED=true yapmayın ta ki pg_dump doğrulanana kadar.
      - key: DB_BACKUP_ENABLED
        value: "true"
      - key: DB_BACKUP_REQUIRED
        value: "false"
      - key: S3_BACKUP_BUCKET
        value: erp-backups
      - key: S3_BUCKET_PREFIX
        value: erp
      # Gözlemlenebilirlik — Dashboard'dan secret değerleri girin (sync: false).
      # Sentry: hata yakalama. OTel: HTTP+pg trace (Grafana Cloud, Honeycomb, vb.).
      - key: SENTRY_DSN
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_SERVICE_NAME
        value: haksan-api
      # Prometheus scrape koruması (opsiyonel). Boş bırakılırsa /metrics herkese açık.
      - key: METRICS_TOKEN
        sync: false
      - key: S3_PROVIDER
        value: r2
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        sync: false

  - type: web
    name: haksan-web
    runtime: static
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build:shared && npm run build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    envVars:
      - key: VITE_API_BASE_URL
        value: https://haksan-api.onrender.com/api/v1
