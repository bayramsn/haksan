# Render Blueprint — staging (production = kendi VDS, bkz. deploy/README.md)
# Depolama: Cloudflare R2 (S3 uyumlu) — S3_* dashboard'dan girilir.
#
# İlk deploy sonrası API Shell (sıfır iş verisi — siz doldurursunuz):
#   npm run db:seed
#   TENANT_NAME=... TENANT_SLUG=... ADMIN_EMAIL=... ADMIN_PASSWORD=... ADMIN_NAME=... npm run db:bootstrap
# Demo veri YÜKLEMEYİN (npm run db:seed:demo).

databases:
  - name: haksan-db
    databaseName: haksan
    user: haksan
    plan: free
    region: frankfurt

services:
  - type: web
    name: haksan-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    branch: main
    autoDeploy: true
    # /health/ready gates on DB connectivity AND applied-migration count, so a
    # deploy with pending/failed migrations will not start receiving traffic.
    healthCheckPath: /health/ready
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci --workspace @haksan/shared --workspace @haksan/api --workspace @haksan/web --include-workspace-root && npm run build:shared && npm run build:api
    # Free tier does not support preDeployCommand, so the compiled migration
    # chain runs before the API process starts. Migration scripts are idempotent.
    #
    # Startup chain (compiled, no tsx/devDependency at deploy time):
    #   1) migrate   — schema migrations. SQL + journal are copied into dist via
    #                  nest-cli `assets`; path resolved from __dirname (cwd-safe).
    #   3) data-migrate — idempotent DML (e.g. new permissions -> existing roles).
    # Render free staging runtime does not ship pg_dump. Customer-data production
    # deployments use the VDS pipeline, which requires verified local/offsite backups.
    startCommand: node apps/api/dist/db/migrate.js && node apps/api/dist/db/data-migrate.js && node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DB_PROVIDER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: haksan-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Host-only cookie (Domain yok) — çapraz-origin refresh için api alt alanında bırakılır.
      - key: COOKIE_DOMAIN
        value: localhost
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        value: https://haksan-web.onrender.com
      - key: AUTH_DEV_RESET_TOKEN_RESPONSE
        value: "false"
      - key: CALL_WEBHOOK_SECRET
        sync: false
      # Render blueprint is staging-only. Production backups are performed by the
      # VDS deployment pipeline before migrations, rather than silently skipped.
      - key: DB_BACKUP_ENABLED
        value: "false"
      - key: DB_BACKUP_REQUIRED
        value: "false"
      - key: S3_BUCKET_PREFIX
        value: erp
      # Gözlemlenebilirlik — Dashboard'dan secret değerleri girin (sync: false).
      # Sentry: hata yakalama. OTel: HTTP+pg trace (Grafana Cloud, Honeycomb, vb.).
      - key: SENTRY_DSN
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_SERVICE_NAME
        value: haksan-api
      # Prometheus scrape koruması (production startup requires this secret).
      - key: METRICS_TOKEN
        sync: false
      - key: S3_PROVIDER
        value: r2
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_FROM
        sync: false
      - key: APP_PUBLIC_URL
        value: https://haksan-web.onrender.com
      - key: USER_MAIL_ENABLED
        value: "true"
      - key: USER_MAIL_SMTP_HOST
        value: mail.haksancnc.com.tr
      - key: USER_MAIL_SMTP_PORT
        value: "587"
      - key: USER_MAIL_SMTP_SECURE
        value: "false"
      - key: USER_MAIL_ALLOWED_EMAIL_DOMAINS
        value: haksancnc.com.tr
      - key: USER_MAIL_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      # NVIDIA NIM integration is ready, but kept disabled until a fresh API key
      # and tenant-level data-processing approval are configured in Render.
      - key: ASSISTANT_LLM_PROVIDER
        value: none
      - key: ASSISTANT_MODEL
        value: qwen/qwen3-next-80b-a3b-instruct
      - key: ASSISTANT_API_KEY
        sync: false
      - key: ASSISTANT_MAX_TOKENS
        value: "700"
      - key: ASSISTANT_TEMPERATURE
        value: "0.2"
      - key: ASSISTANT_TOP_P
        value: "0.8"
      - key: ASSISTANT_DAILY_TOKEN_BUDGET
        value: "50000"

  - type: web
    name: haksan-web
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci --workspace @haksan/shared --workspace @haksan/api --workspace @haksan/web --include-workspace-root && npm run build:shared && npm run build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://haksan-api.onrender.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://haksan-api.onrender.com wss://haksan-api.onrender.com; frame-src 'self' https://haksan-api.onrender.com https://*.r2.cloudflarestorage.com; media-src 'self' blob: https://haksan-api.onrender.com https://*.r2.cloudflarestorage.com; form-action 'self'; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(self)"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    envVars:
      - key: VITE_API_BASE_URL
        value: https://haksan-api.onrender.com/api/v1
