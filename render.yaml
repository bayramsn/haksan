# Render Blueprint — Haksan ERP API + static web + Postgres.
# Depolama: Cloudflare R2 (S3 uyumlu) — S3_* dashboard'dan girilir.
#
# İlk deploy sonrası API Shell:
#   TENANT_NAME=... TENANT_SLUG=... ADMIN_EMAIL=... ADMIN_PASSWORD=... ADMIN_NAME=... npm run db:bootstrap

databases:
  - name: haksan-db
    databaseName: haksan
    user: haksan
    plan: free
    region: frankfurt

services:
  - type: web
    name: haksan-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm ci && npm run build:shared && npm run build:api
    preDeployCommand: npm run db:migrate
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PROVIDER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: haksan-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_DOMAIN
        value: haksan-api.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        value: https://haksan-web.onrender.com
      - key: AUTH_DEV_RESET_TOKEN_RESPONSE
        value: "false"
      - key: S3_PROVIDER
        value: r2
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        sync: false

  - type: web
    name: haksan-web
    runtime: static
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build:shared && npm run build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    envVars:
      - key: VITE_API_BASE_URL
        value: https://haksan-api.onrender.com/api/v1
