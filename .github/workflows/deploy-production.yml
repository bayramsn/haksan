name: Production Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to confirm the production release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: haksan-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "866490183348"
  AWS_REGION: eu-central-1
  API_REPOSITORY: haksan/api
  WEB_REPOSITORY: haksan/web
  ARTIFACT_BUCKET: haksan-prod-deploy-artifacts-866490183348-eu-central-1
  INSTANCE_ID: i-0fac9a4d4eca0cf13
  PRODUCTION_ROLE_ARN: arn:aws:iam::866490183348:role/HaksanGitHubProductionDeploy

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Resolve release revision
        id: revision
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            sha="${WORKFLOW_RUN_SHA}"
          else
            sha="${GITHUB_SHA}"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "release_id=github-${GITHUB_RUN_ID}-${sha:0:12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ env.PRODUCTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: haksan-production-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Login to ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build and push immutable images
        id: images
        shell: bash
        env:
          RELEASE_ID: ${{ steps.revision.outputs.release_id }}
          SHORT_SHA: ${{ steps.revision.outputs.short_sha }}
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          api_tag="${registry}/${API_REPOSITORY}:${RELEASE_ID}"
          web_tag="${registry}/${WEB_REPOSITORY}:${RELEASE_ID}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          docker build --provenance=false \
            --build-arg "API_RELEASE_ID=${RELEASE_ID}" \
            --build-arg "BUILD_TIME=${build_time}" \
            --label "com.haksan.api-release=${RELEASE_ID}" \
            -f deploy/Dockerfile.api-only \
            -t "$api_tag" .
          docker build --provenance=false \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --label "com.haksan.web-release=${RELEASE_ID}" \
            -f deploy/Dockerfile.web \
            -t "$web_tag" .

          docker push "$api_tag"
          docker push "$web_tag"

          api_digest="$(aws ecr describe-images --repository-name "$API_REPOSITORY" --image-ids "imageTag=${RELEASE_ID}" --query 'imageDetails[0].imageDigest' --output text)"
          web_digest="$(aws ecr describe-images --repository-name "$WEB_REPOSITORY" --image-ids "imageTag=${RELEASE_ID}" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$api_digest" == sha256:* && "$web_digest" == sha256:* ]]
          echo "api_uri=${registry}/${API_REPOSITORY}@${api_digest}" >> "$GITHUB_OUTPUT"
          echo "web_uri=${registry}/${WEB_REPOSITORY}@${web_digest}" >> "$GITHUB_OUTPUT"

      - name: Block vulnerable release images
        shell: bash
        env:
          RELEASE_ID: ${{ steps.revision.outputs.release_id }}
        run: |
          set -euo pipefail
          for repository in "$API_REPOSITORY" "$WEB_REPOSITORY"; do
            aws ecr wait image-scan-complete \
              --repository-name "$repository" \
              --image-id "imageTag=${RELEASE_ID}"
            findings="$(aws ecr describe-image-scan-findings \
              --repository-name "$repository" \
              --image-id "imageTag=${RELEASE_ID}" \
              --output json)"
            critical="$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' <<<"$findings")"
            high="$(jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' <<<"$findings")"
            echo "$repository scan: CRITICAL=$critical HIGH=$high"
            [[ "$critical" == "0" && "$high" == "0" ]]
          done

      - name: Publish verified deploy runner
        id: runner
        shell: bash
        env:
          RELEASE_ID: ${{ steps.revision.outputs.release_id }}
        run: |
          set -euo pipefail
          runner_sha="$(sha256sum deploy/deploy-ecr-release.sh | awk '{print $1}')"
          runner_uri="s3://${ARTIFACT_BUCKET}/releases/ci/${RELEASE_ID}/deploy-ecr-release.sh"
          aws s3 cp deploy/deploy-ecr-release.sh "$runner_uri" --sse AES256 --only-show-errors
          echo "sha=$runner_sha" >> "$GITHUB_OUTPUT"
          echo "uri=$runner_uri" >> "$GITHUB_OUTPUT"

      - name: Deploy through Systems Manager
        shell: bash
        env:
          RELEASE_ID: ${{ steps.revision.outputs.release_id }}
          API_IMAGE_URI: ${{ steps.images.outputs.api_uri }}
          WEB_IMAGE_URI: ${{ steps.images.outputs.web_uri }}
          RUNNER_SHA: ${{ steps.runner.outputs.sha }}
          RUNNER_URI: ${{ steps.runner.outputs.uri }}
        run: |
          set -euo pipefail
          parameters="$(jq -cn \
            --arg runner_uri "$RUNNER_URI" \
            --arg runner_sha "$RUNNER_SHA" \
            --arg release "$RELEASE_ID" \
            --arg api "$API_IMAGE_URI" \
            --arg web "$WEB_IMAGE_URI" \
            '{
              ReleaseId:[$release],
              ApiImageUri:[$api],
              WebImageUri:[$web],
              RunnerUri:[$runner_uri],
              RunnerSha256:[$runner_sha]
            }')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name HaksanDeployEcrRelease \
            --timeout-seconds 1800 \
            --comment "${RELEASE_ID}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command id: $command_id"
          set +e
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          waiter_status="$?"
          set -e

          invocation="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json)"
          jq . <<<"$invocation"
          status="$(jq -r '.Status' <<<"$invocation")"
          [[ "$waiter_status" == "0" && "$status" == "Success" ]]
