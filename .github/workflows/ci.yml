name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: haksan
          POSTGRES_USER: haksan
          POSTGRES_PASSWORD: haksan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haksan -d haksan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://haksan:haksan_test@localhost:5432/haksan
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci_test_access_secret_32_chars_min
      JWT_REFRESH_SECRET: ci_test_refresh_secret_32_chars_min
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: NPM_CONFIG_PRODUCTION=false npm ci

      # Shared types must be built first so api/web typecheck against fresh output.
      - name: Build shared
        run: npm run build:shared

      - name: Typecheck (api)
        run: npm run typecheck

      - name: Contract audit (@Body/@Query must use ZodValidationPipe)
        run: npm run audit:contracts

      - name: Migration safety lint
        run: npm run lint:migrations

      # Schema and committed migrations must be in sync. Any change here — a modified
      # snapshot/journal OR a brand-new untracked .sql that db:generate emits — means a
      # developer changed the Drizzle schema without committing the generated migration.
      - name: DB drift gate
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain apps/api/src/db/migrations)" ]; then
            echo "::error::Schema drift detected. Run 'npm run db:generate' and commit the generated migration."
            git status --porcelain apps/api/src/db/migrations
            git diff apps/api/src/db/migrations
            exit 1
          fi

      - name: Build api & web
        run: |
          npm run build:api
          VITE_API_BASE_URL=https://example.com/api/v1 npm run build:web

      # Guards the 2026-06-23 incident: a stale build cache left dist/_journal.json
      # behind the source, so the prod migrator silently skipped 12 migrations. The
      # built journal must always match the committed source journal entry-for-entry.
      - name: Assert built migrations journal matches source
        run: |
          SRC=$(node -p "require('./apps/api/src/db/migrations/meta/_journal.json').entries.length")
          DIST=$(node -p "require('./apps/api/dist/db/migrations/meta/_journal.json').entries.length")
          echo "source journal entries: $SRC, built (dist) journal entries: $DIST"
          if [ "$SRC" != "$DIST" ]; then
            echo "::error::Built migrations journal ($DIST) does not match source ($SRC). dist is stale — check nest-cli deleteOutDir/assets."
            exit 1
          fi

      - name: Migrate (first run) and seed (CI demo data)
        run: |
          cd apps/api
          npm run db:migrate
          npm run db:seed:demo

      # Idempotency: a second migrate must be a clean no-op (no duplicate-object
      # errors), proving migrations can be safely re-run on redeploy.
      - name: Migrate idempotency (second run is a no-op)
        run: |
          cd apps/api
          npm run db:migrate

      - name: Test with coverage
        run: npm run test:coverage
