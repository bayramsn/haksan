name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: haksan
          POSTGRES_USER: haksan
          POSTGRES_PASSWORD: haksan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haksan -d haksan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://haksan:haksan_test@localhost:5432/haksan
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci_test_access_secret_32_chars_min
      JWT_REFRESH_SECRET: ci_test_refresh_secret_32_chars_min
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: NPM_CONFIG_PRODUCTION=false npm ci

      - name: Build
        run: |
          npm run build:shared
          npm run build:api
          VITE_API_BASE_URL=https://example.com/api/v1 npm run build:web

      - name: Migrate and seed
        run: |
          cd apps/api
          npm run db:migrate
          npm run db:seed

      - name: Test
        run: npm test
