name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: haksan
          POSTGRES_USER: haksan
          POSTGRES_PASSWORD: haksan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haksan -d haksan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://haksan:haksan_test@localhost:5432/haksan
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci_test_access_secret_32_chars_min
      JWT_REFRESH_SECRET: ci_test_refresh_secret_32_chars_min
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PROVIDER: minio
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      RUN_STORAGE_INTEGRATION: "true"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: NPM_CONFIG_PRODUCTION=false npm ci

      - name: Start pinned MinIO integration service
        run: |
          docker run --detach --name haksan-ci-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            if [ "$attempt" = 30 ]; then
              docker logs haksan-ci-minio
              exit 1
            fi
            sleep 2
          done

      - name: Scan repository for credentials
        run: npm run scan:secrets

      - name: Enforce staging and production deployment profiles
        run: npm run validate:deployment-profiles

      - name: Dependency audit (production web/API workspaces)
        run: npm audit --omit=dev --audit-level=high --workspace @haksan/shared --workspace @haksan/api --workspace @haksan/web --include-workspace-root

      # Shared types must be built first so api/web typecheck against fresh output.
      - name: Build shared
        run: npm run build:shared

      - name: Typecheck (api)
        run: npm run typecheck

      - name: Typecheck (web)
        run: npm run typecheck:web

      # Web birim testleri Postgres'e ihtiyaç duymaz; DB/migration zincirinden
      # önce koşsun ki mantık hatası 3 dakika beklemeden düşsün.
      - name: Test (web unit)
        run: npm run test:web

      - name: Contract audit (@Body/@Query must use ZodValidationPipe)
        run: npm run audit:contracts

      - name: Migration safety lint
        run: npm run lint:migrations

      # Custom SQL migrations are used in this repository. Validate Drizzle metadata
      # and require a strict one-to-one, ordered journal ↔ SQL file mapping; running
      # `db:generate` non-interactively can print an error while returning exit code 0.
      - name: Migration journal integrity
        run: |
          npm exec --workspace @haksan/api drizzle-kit check
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = path.join(process.cwd(), 'apps/api/src/db/migrations');
          const journal = JSON.parse(fs.readFileSync(path.join(dir, 'meta/_journal.json'), 'utf8'));
          const files = fs.readdirSync(dir).filter((file) => file.endsWith('.sql')).map((file) => file.slice(0, -4));
          const fileSet = new Set(files);
          const tagSet = new Set();
          const timestampSet = new Set();
          const errors = [];
          let previousIdx = -1;
          let previousWhen = -1;

          for (const entry of journal.entries) {
            if (tagSet.has(entry.tag)) errors.push(`duplicate journal tag: ${entry.tag}`);
            if (timestampSet.has(entry.when)) errors.push(`duplicate migration timestamp: ${entry.when}`);
            if (entry.idx <= previousIdx) errors.push(`journal idx is not increasing at ${entry.tag}`);
            if (entry.when <= previousWhen) errors.push(`journal timestamp is not increasing at ${entry.tag}`);
            if (!fileSet.has(entry.tag)) errors.push(`journal SQL file is missing: ${entry.tag}.sql`);
            tagSet.add(entry.tag);
            timestampSet.add(entry.when);
            previousIdx = entry.idx;
            previousWhen = entry.when;
          }
          for (const file of files) {
            if (!tagSet.has(file)) errors.push(`SQL file is not journaled: ${file}.sql`);
          }
          if (errors.length) {
            for (const error of errors) console.error(`::error::${error}`);
            process.exit(1);
          }
          console.log(`validated ${journal.entries.length} ordered migration entries`);
          NODE

      - name: Build api & web
        run: |
          npm run build:api
          VITE_API_BASE_URL=https://example.com/api/v1 npm run build:web

      # Guards the 2026-06-23 incident: a stale build cache left dist/_journal.json
      # behind the source, so the prod migrator silently skipped 12 migrations. The
      # built journal must always match the committed source journal entry-for-entry.
      - name: Assert built migrations journal matches source
        run: |
          SRC=$(node -p "require('./apps/api/src/db/migrations/meta/_journal.json').entries.length")
          DIST=$(node -p "require('./apps/api/dist/db/migrations/meta/_journal.json').entries.length")
          echo "source journal entries: $SRC, built (dist) journal entries: $DIST"
          if [ "$SRC" != "$DIST" ]; then
            echo "::error::Built migrations journal ($DIST) does not match source ($SRC). dist is stale — check nest-cli deleteOutDir/assets."
            exit 1
          fi

      - name: Migrate (first run) and seed (CI demo data)
        run: |
          mkdir -p output/ci
          set -o pipefail
          (npm run db:migrate && npm run db:seed:demo) 2>&1 | tee output/ci/migrate-seed.log

      # Idempotency: a second migrate must be a clean no-op (no duplicate-object
      # errors), proving migrations can be safely re-run on redeploy.
      - name: Migrate idempotency (second run is a no-op)
        run: |
          mkdir -p output/ci
          set -o pipefail
          npm run db:migrate 2>&1 | tee output/ci/migrate-idempotency.log

      - name: Test with coverage
        run: |
          mkdir -p output/ci
          set -o pipefail
          npm run test:coverage 2>&1 | tee output/ci/api-test.log

      - name: Collect API test service diagnostics
        if: failure()
        run: |
          mkdir -p output/ci
          docker logs haksan-ci-minio > output/ci/minio.log 2>&1 || true

      - name: Upload API test failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-test-diagnostics
          path: |
            output/ci
            apps/api/coverage
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      # Mod build-time bir Vite değişkeni; tek dev server tek moddadır, aynı
      # koşuda iki modu denemek imkânsız. Matris olmadan legacy dalın hiçbir
      # satırı koşmuyordu.
      fail-fast: false
      matrix:
        # Tırnak şart: YAML `on` değerini boolean olarak ayrıştırır ve flag
        # `true` olarak geçip `normalizeMode` tarafından `legacy`'ye düşer —
        # sade mod job'ı sessizce legacy koşardı.
        workspace_mode: ["on", "legacy"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: haksan
          POSTGRES_USER: haksan
          POSTGRES_PASSWORD: haksan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haksan -d haksan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://haksan:haksan_test@localhost:5432/haksan
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci_test_access_secret_32_chars_min
      JWT_REFRESH_SECRET: ci_test_refresh_secret_32_chars_min
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      VITE_OPPORTUNITY_WORKSPACE_SIMPLE: ${{ matrix.workspace_mode }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: NPM_CONFIG_PRODUCTION=false npm ci

      - name: Build shared contracts
        run: npm run build:shared

      - name: Prepare deterministic E2E data
        run: |
          npm --workspace @haksan/api run db:migrate
          npm --workspace @haksan/api run db:seed:demo

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E suite
        run: |
          npm --prefix ../.. --workspace @haksan/api run dev > /tmp/haksan-api-e2e.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --output /dev/null http://localhost:3000/api/v1/fx/rates; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              cat /tmp/haksan-api-e2e.log
              exit 1
            fi
            sleep 1
          done
          npx playwright test --workers=1 --retries=0
        working-directory: apps/web

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.workspace_mode }}
          path: output/playwright/test-results
          if-no-files-found: ignore
          retention-days: 14
