services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: haksan_test
      POSTGRES_USER: haksan_test
      POSTGRES_PASSWORD: ${HAKSAN_TEST_DB_PASSWORD:?HAKSAN_TEST_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${HAKSAN_TEST_DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haksan_test -d haksan_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${HAKSAN_TEST_MINIO_ROOT_USER:?HAKSAN_TEST_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${HAKSAN_TEST_MINIO_ROOT_PASSWORD:?HAKSAN_TEST_MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${HAKSAN_TEST_S3_PORT:-59000}:9000"
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${HAKSAN_TEST_MINIO_ROOT_USER:?HAKSAN_TEST_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${HAKSAN_TEST_MINIO_ROOT_PASSWORD:?HAKSAN_TEST_MINIO_ROOT_PASSWORD is required}
      S3_ACCESS_KEY_ID: ${HAKSAN_TEST_S3_ACCESS_KEY_ID:?HAKSAN_TEST_S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${HAKSAN_TEST_S3_SECRET_ACCESS_KEY:?HAKSAN_TEST_S3_SECRET_ACCESS_KEY is required}
    security_opt:
      - no-new-privileges:true
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mc admin user add local \"$${S3_ACCESS_KEY_ID}\" \"$${S3_SECRET_ACCESS_KEY}\";
      mc admin policy attach local readwrite --user \"$${S3_ACCESS_KEY_ID}\";
      mc mb -p local/erp-product-images;
      mc mb -p local/erp-company-logos;
      mc mb -p local/erp-brand-logos;
      mc mb -p local/erp-signatures;
      mc mb -p local/erp-quote-documents;
      mc mb -p local/erp-proforma-documents;
      mc mb -p local/erp-contract-documents;
      mc mb -p local/erp-invoice-documents;
      mc mb -p local/erp-stock-documents;
      mc mb -p local/erp-service-documents;
      mc mb -p local/erp-import-raw;
      "
